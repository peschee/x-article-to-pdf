<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 200px;
      padding: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      margin: 0;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
    }
    button:last-child {
      margin-bottom: 0;
    }
    button:hover {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <button id="open-browser">Open in browser</button>
  <button id="download-html">Download as .html</button>
  <script src="popup.js"></script>
</body>
</html>
